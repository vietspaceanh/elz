[project]
name = "elz"
version = "0.2.1"
requires-python = ">=3.13"
dependencies = [
    "pygments>=2.19.2",
    "mistune>=3.1.4",
]

[dependency-groups]
dev = [
    "fsspec>=2026.4.0",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "pytest>=9.0.3",
    "tabulate>=0.10.0",
    "jupyter>=1.1.1",
]

[tool.setuptools.packages.find]
include = ["elz*"]
